[package]
name = "chd312-win11-24h2-fix"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Unofficial CHD312 USB audio driver workaround for Windows 11 24H2 and later"
license = "MIT"

[features]
bundle-worker = []

[lib]
name = "chd312_win11_fix"

[[bin]]
name = "chd312"
path = "src/main.rs"

[[bin]]
name = "chd312-background"
path = "src/background.rs"

[dependencies]
anyhow = "1.0.99"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
windows-sys = { version = "0.61.2", features = [
  "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties",
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes",
  "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Memory",
  "Win32_System_Console", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

