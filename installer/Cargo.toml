[package]
name = "chd312-setup"
version = "0.1.1"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
chd312-win11-24h2-fix = { path = ".." }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
